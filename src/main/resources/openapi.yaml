openapi: 3.0.3
info:
  title: Maintenance Request Manager
  version: 1.0.0

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    TicketCreateRequest:
      type: object
      required: [title, description]
      properties:
        title:
          type: string
        description:
          type: string

    TicketUpdateRequest:
      type: object
      required:
        - status
      properties:
        status:
          $ref: '#/components/schemas/TicketStatus'

    TicketResponse:
      type: object
      properties:
        id:
          type: integer
          format: int64
        title:
          type: string
        description:
          type: string
        status:
          $ref: '#/components/schemas/TicketStatus'
        createdAt:
          type: string
          format: date-time

    AttachmentListResponse:
      type: array
      items:
        $ref: '#/components/schemas/AttachmentResponse'

    TicketStatus:
      type: string
      enum:
        - NEW
        - ACTIVE
        - CLOSED

    AttachmentResponse:
      type: object
      description: Metadata about a file attached to a ticket
      properties:
        id:
          type: integer
          format: int64
          example: 42

        filename:
          type: string
          description: Original filename uploaded by the user

        contentType:
          type: string

        size:
          type: integer
          format: int64
          description: File size in bytes
          example: 482193

        uploadedAt:
          type: string
          format: date-time
          example: 2025-01-10T14:23:12Z

        uploadedBy:
          type: object
          description: User who uploaded the attachment
          properties:
            id:
              type: integer
            name:
              type: string
          example:
            id: 12
            name: John Smith

        downloadUrl:
          type: string
          format: uri
          description: Secure endpoint to download the file
          example: /api/tickets/5/attachments/42/download


    TicketListResponse:
      type: array
      items:
        $ref: '#/components/schemas/TicketResponse'

security:
  - bearerAuth: []


paths:
  /tickets:
    get:
      summary: Retrieve all tickets created by the authenticated user
      security:
        - bearerAuth: [ ]
      responses:
        '200':
          description: List of tickets
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TicketListResponse'

    post:
      summary: Create a new ticket
      security:
        - bearerAuth: [ ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TicketCreateRequest'
      responses:
        '201':
          description: Ticket created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TicketResponse'

  /tickets/{id}:
    get:
      summary: Retrieve a single ticket
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: Ticket details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TicketResponse'

    patch:
      summary: Update or close a ticket
      security:
        - bearerAuth: [ ]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TicketUpdateRequest'
      responses:
        '200':
          description: Ticket updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TicketResponse'

  /tickets/{id}/attachments:
    post:
      summary: Upload attachment to ticket
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [ file ]
              properties:
                file:
                  type: string
                  format: binary
      responses:
        '201':
          description: Attachment uploaded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AttachmentResponse'

  /attachments/{attachmentId}:
    get:
      summary: Download attachment
      security:
        - bearerAuth: [ ]
      parameters:
        - name: attachmentId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: File stream
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary